<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacred Gold Pokédex - Movimientos Completos</title>
<style>
:root{--bg:#0d0d1a;--bg2:#151528;--bg3:#1a1a3e;--card:#1e2a4a;--text:#e8e8e8;--muted:#889;--accent:#ff4757;--gold:#ffd700;
--normal:#A8A878;--fire:#F08030;--water:#6890F0;--electric:#F8D030;--grass:#78C850;--ice:#98D8D8;--fighting:#C03028;
--poison:#A040A0;--ground:#E0C068;--flying:#A890F0;--psychic:#F85888;--bug:#A8B820;--rock:#B8A038;--ghost:#705898;
--dragon:#7038F8;--dark:#705848;--steel:#B8B8D0;--fairy:#EE99AC;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,var(--bg2),var(--bg));padding:22px;text-align:center;border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:100}
.header h1{color:var(--accent);font-size:2rem;text-shadow:0 0 15px rgba(255,71,87,.4)}
.header p{color:var(--muted);font-size:.82rem;margin-top:4px}
.controls{background:var(--bg2);padding:14px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;border-bottom:1px solid #2a2a4a}
.search-box{position:relative;flex:1;min-width:260px;max-width:380px}
.search-box input{width:100%;padding:11px 18px;border:2px solid #2a2a4a;border-radius:22px;background:var(--bg);color:var(--text);font-size:.95rem;outline:none;transition:.3s}
.search-box input:focus{border-color:var(--accent)}
.type-filters{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.type-btn{padding:5px 11px;border:none;border-radius:10px;cursor:pointer;font-size:.68rem;font-weight:bold;text-transform:uppercase;color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.5);transition:.2s;opacity:.5}
.type-btn:hover,.type-btn.active{opacity:1;transform:scale(1.07);box-shadow:0 0 6px rgba(255,255,255,.2)}
.gen-filter{display:flex;gap:3px}
.gen-btn{padding:7px 13px;border:2px solid #2a2a4a;border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;font-weight:bold;font-size:.78rem;transition:.3s}
.gen-btn:hover,.gen-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.stats-info{text-align:center;padding:8px;color:var(--muted);font-size:.85rem}
.pokemon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:16px;max-width:1400px;margin:0 auto}
.pokemon-card{background:var(--card);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.25s;border:2px solid transparent;position:relative;overflow:hidden}
.pokemon-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(255,71,87,.2);border-color:var(--accent)}
.pokemon-card .num{position:absolute;top:6px;left:8px;font-size:.65rem;color:var(--muted);font-weight:bold}
.pokemon-card .evo-badge{position:absolute;top:6px;right:8px;background:var(--gold);color:#222;font-size:.55rem;padding:2px 5px;border-radius:4px;font-weight:bold}
.pokemon-card img{width:80px;height:80px;image-rendering:pixelated;margin:6px 0}
.pokemon-card .name{font-size:.9rem;font-weight:bold;text-transform:capitalize;margin-bottom:5px}
.pokemon-card .types{display:flex;gap:3px;justify-content:center}
.type-badge{padding:2px 8px;border-radius:6px;font-size:.6rem;font-weight:bold;text-transform:uppercase;color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.5)}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:1000;justify-content:center;align-items:center;padding:12px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal-content{background:var(--bg2);border-radius:16px;max-width:720px;width:100%;max-height:94vh;overflow-y:auto;position:relative;border:2px solid var(--accent)}
.modal-close{position:absolute;top:10px;right:10px;background:var(--accent);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1.2rem;z-index:10}
.shiny-toggle{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,var(--gold),#ffaa00);border:none;color:#222;padding:6px 12px;border-radius:15px;cursor:pointer;font-weight:bold;font-size:.72rem;z-index:10}
.modal-header{background:linear-gradient(135deg,var(--card),var(--bg));padding:20px;text-align:center;border-radius:16px 16px 0 0;position:relative}
.modal-header img{width:100px;height:100px;image-rendering:pixelated}
.modal-header h2{font-size:1.6rem;text-transform:capitalize;margin:6px 0}
.modal-header .modal-types{display:flex;gap:7px;justify-content:center;margin-top:6px}
.modal-body{padding:18px}
.info-section{margin-bottom:18px}
.info-section h3{color:var(--accent);margin-bottom:8px;font-size:1rem;border-bottom:2px solid #2a2a4a;padding-bottom:3px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat-item{background:var(--bg);padding:8px;border-radius:8px;text-align:center}
.stat-item .s-name{font-size:.62rem;color:var(--muted);text-transform:uppercase}
.stat-item .s-val{font-size:1.2rem;font-weight:bold;color:var(--accent)}
.stat-bar{width:100%;height:4px;background:var(--bg2);border-radius:2px;margin-top:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),#ff6b8a);transition:width .4s}
.abilities-list{display:flex;flex-wrap:wrap;gap:6px}
.ability-item{background:var(--bg);padding:6px 10px;border-radius:6px;font-size:.85rem}
.evo-box{background:linear-gradient(135deg,#2a1a1a,#1a0f0f);border:2px solid var(--gold);border-radius:10px;padding:14px;margin-top:14px}
.evo-box h3{color:var(--gold);margin-bottom:8px;font-size:1rem}
.evo-text{white-space:pre-line;line-height:1.6;font-size:.88rem;color:var(--text)}
.moves-box{background:var(--bg);border-radius:10px;padding:12px;max-height:280px;overflow-y:auto;margin-top:10px}
.move-row{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #2a2a4a;font-size:.85rem}
.move-row:last-child{border:none}
.move-lvl{color:var(--accent);font-weight:bold;min-width:50px}
.total-stat{text-align:center;padding:8px;background:var(--bg);border-radius:8px;margin-bottom:10px;font-size:.9rem}
.total-stat span{color:var(--accent);font-weight:bold;font-size:1.1rem}
.loading{text-align:center;padding:35px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid #2a2a4a;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.pokemon-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:10px}.header h1{font-size:1.5rem}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

const TYPE_COLORS = {normal:'var(--normal)',fire:'var(--fire)',water:'var(--water)',electric:'var(--electric)',grass:'var(--grass)',ice:'var(--ice)',fighting:'var(--fighting)',poison:'var(--poison)',ground:'var(--ground)',flying:'var(--flying)',psychic:'var(--psychic)',bug:'var(--bug)',rock:'var(--rock)',ghost:'var(--ghost)',dragon:'var(--dragon)',dark:'var(--dark)',steel:'var(--steel)',fairy:'var(--fairy)'};

const TYPE_NAMES_ES = {normal:'Normal',fire:'Fuego',water:'Agua',electric:'Eléctrico',grass:'Planta',ice:'Hielo',fighting:'Lucha',poison:'Veneno',ground:'Tierra',flying:'Volador',psychic:'Psíquico',bug:'Bicho',rock:'Roca',ghost:'Fantasma',dragon:'Dragón',dark:'Siniestro',steel:'Acero',fairy:'Hada'};

const STAT_NAMES = {hp:'PS',attack:'Ataque',defense:'Defensa','special-attack':'Atq. Esp.','special-defense':'Def. Esp.',speed:'Velocidad'};

const STAT_MAX = {hp:255,attack:190,defense:230,'special-attack':180,'special-defense':230,speed:180};

let currentGen='all',activeTypes=new Set(),isShiny=false,currentId=null;
const allIds=Object.keys(POKEDEX).map(Number).sort((a,b)=>a-b);

function createTypeFilters(){
const c=document.getElementById('typeFilters');
Object.keys(TYPE_COLORS).forEach(t=>{
const b=document.createElement('button');b.className='type-btn';b.style.background=TYPE_COLORS[t];b.textContent=TYPE_NAMES_ES[t];b.dataset.type=t;b.onclick=()=>toggleType(t,b);c.appendChild(b);
});
}

function toggleType(t,b){
if(activeTypes.has(t)){activeTypes.delete(t);b.classList.remove('active');}else{activeTypes.add(t);b.classList.add('active');}
filterPokemon();
}

function setupListeners(){
document.getElementById('searchInput').addEventListener('input',filterPokemon);
document.querySelectorAll('.gen-btn').forEach(b=>b.addEventListener('click',()=>{
document.querySelectorAll('.gen-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentGen=b.dataset.gen;filterPokemon();
}));
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
}

function getGen(id){return id<=151?'1':id<=251?'2':id<=386?'3':'4';}

function filterPokemon(){
const s=document.getElementById('searchInput').value.toLowerCase().trim();
const filtered=allIds.filter(id=>{
if(currentGen!=='all'&&getGen(id)!==currentGen)return false;
const p=POKEDEX[id];
if(activeTypes.size>0&&!p.t.some(t=>activeTypes.has(t)))return false;
if(s){const mn=p.n.toLowerCase().includes(s);const mi=id.toString()===s||id.toString().padStart(3,'0')===s;if(!mn&&!mi)return false;}
return true;
});
renderGrid(filtered);
document.getElementById('statsInfo').textContent=`Mostrando ${filtered.length} de ${allIds.length} Pokemon`;
}

function renderGrid(ids){
const g=document.getElementById('pokemonGrid');
if(ids.length===0){g.innerHTML='<div class="loading">No se encontraron Pokemon.</div>';return;}
g.innerHTML=ids.map(id=>{
const p=POKEDEX[id];
const hasEvo=p.e&&p.e.trim()&&p.e.includes('->');
const spriteBase=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/heartgold-soulsilver/`;
const sprite=isShiny?`${spriteBase}shiny/${id}.png`:`${spriteBase}${id}.png`;
const fallback=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
return `<div class="pokemon-card" onclick="openModal(${id})"><span class="num">#${id.toString().padStart(3,'0')}</span>${hasEvo?'<span class="evo-badge">EVO</span>':''}<img src="${sprite}" alt="${p.n}" loading="lazy" onerror="this.src='${fallback}'"><div class="name">${p.n}</div><div class="types">${p.t.map(t=>`<span class="type-badge" style="background:${TYPE_COLORS[t]}">${TYPE_NAMES_ES[t]}</span>`).join('')}</div></div>`;
}).join('');
}

function openModal(id){
currentId=id;isShiny=false;document.getElementById('shinyToggle').textContent='✨ Normal';
const p=POKEDEX[id];
const m=document.getElementById('modal');
const b=document.getElementById('modalBody');
const spriteBase=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/heartgold-soulsilver/`;
const sprite=`${spriteBase}${id}.png`;
const shiny=`${spriteBase}shiny/${id}.png`;
const fallback=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;

const total=Object.values(p.s).reduce((a,v)=>a+v,0);

const statsHtml=Object.entries(STAT_NAMES).map(([k,l])=>{
const v=p.s[k]||0;const mx=STAT_MAX[k]||150;const pc=Math.min((v/mx)*100,100);
return`<div class="stat-item"><div class="s-name">${l}</div><div class="s-val">${v}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${pc}%"></div></div></div>`;
}).join('');

const movesHtml=p.m&&p.m.length?`<div class="info-section"><h3>🎯 Movimientos por Nivel (${p.m.length})</h3><div class="moves-box">${p.m.map(mv=>`<div class="move-row"><span class="move-lvl">Nv. ${mv.level}</span><span>${mv.name}</span></div>`).join('')}</div></div>`:'';

const evoHtml=p.e&&p.e.trim()?`<div class="evo-box"><h3>🔄 Evolucion</h3><div class="evo-text">${p.e.replace(/\n/g,'<br>')}</div></div>`:'';

b.innerHTML=`<div class="modal-header"><img id="modalSprite" src="${sprite}" alt="${p.n}" onerror="this.src='${fallback}'"><h2>#${id.toString().padStart(3,'0')} ${p.n}</h2><div class="modal-types">${p.t.map(t=>`<span class="type-badge" style="background:${TYPE_COLORS[t]};font-size:.8rem;padding:4px 12px">${TYPE_NAMES_ES[t]}</span>`).join('')}</div></div><div class="modal-body"><div class="info-section"><h3>📊 Estadisticas Base</h3><div class="total-stat">Total: <span>${total}</span></div><div class="stats-grid">${statsHtml}</div></div><div class="info-section"><h3>⚡ Habilidades</h3><div class="abilities-list">${p.a.map(a=>`<div class="ability-item">${a}</div>`).join('')}</div></div>${evoHtml}${movesHtml}</div>`;

m.classList.add('active');document.body.style.overflow='hidden';
}

function toggleShiny(){
isShiny=!isShiny;document.getElementById('shinyToggle').textContent=isShiny?'⭐ Shiny':'✨ Normal';
if(!currentId)return;
const sprite=document.getElementById('modalSprite');
const base=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/heartgold-soulsilver/`;
if(isShiny)sprite.src=`${base}shiny/${currentId}.png`;else sprite.src=`${base}${currentId}.png`;
}

function closeModal(){
document.getElementById('modal').classList.remove('active');document.body.style.overflow='';currentId=null;
}

document.addEventListener('DOMContentLoaded',()=>{
createTypeFilters();setupListeners();filterPokemon();
});
</script>
